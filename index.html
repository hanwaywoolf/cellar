<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
// Service worker registration
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(reg => {
    console.log('[PWA] SW registered, scope:', reg.scope);
  }).catch(err => {
    console.warn('[PWA] SW registration failed:', err);
  });
}

// Install prompt — shows a banner when Chrome decides the app is installable
let _installPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _installPrompt = e;
  const banner = document.getElementById('pwa-banner');
  if (banner) banner.removeAttribute('hidden');
});

window.addEventListener('appinstalled', () => {
  const banner = document.getElementById('pwa-banner');
  if (banner) banner.setAttribute('hidden', '');
  _installPrompt = null;
});

window.triggerInstall = function () {
  if (!_installPrompt) return;
  _installPrompt.prompt();
  _installPrompt.userChoice.then(() => { _installPrompt = null; });
  document.getElementById('pwa-banner').setAttribute('hidden', '');
};
</script>

<!-- PWA install banner — only visible when Chrome fires beforeinstallprompt -->
<div id="pwa-banner" hidden style="
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; gap: 12px;
  background: #6d1f2f; color: #f3e6cf;
  font-family: system-ui, sans-serif; font-size: 15px;
  box-shadow: 0 -2px 16px rgba(0,0,0,0.3);
">
  <span>Add CoChez Cellar to your Home Screen</span>
  <button onclick="triggerInstall()" style="
    background: #f3e6cf; color: #6d1f2f; border: none;
    padding: 8px 18px; border-radius: 8px;
    font-weight: 700; font-size: 14px; cursor: pointer;
  ">Install</button>
</div>
</body>
</html>
