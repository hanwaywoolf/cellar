<script>
  // iOS reliably reports standalone via navigator.standalone; also catch the
  // cross-browser display-mode. Set a class so CSS guarantees status-bar clearance.
  (function(){
    try{
      var standalone = (window.navigator.standalone === true) ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      if(standalone) document.documentElement.classList.add('pwa-standalone');
    }catch(e){}
  })();
</script>

<div id="pwa-update">
  <span>Update available</span>
  <button onclick="window._applyUpdate()">Refresh</button>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(reg => {
    // New SW waiting on first load
    if (reg.waiting) showUpdate(reg);

    // New SW found after page already loaded
    reg.addEventListener('updatefound', () => {
      const sw = reg.installing;
      sw.addEventListener('statechange', () => {
        if (sw.state === 'installed' && navigator.serviceWorker.controller) {
          showUpdate(reg);
        }
      });
    });

    // Check for an update every time the app comes back into focus
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') reg.update();
    });
  }).catch(err => console.warn('[PWA] SW registration failed:', err));

  // When the new SW takes over, reload to get fresh assets
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!reloading) { reloading = true; location.reload(); }
  });
}

function showUpdate(reg) {
  const toast = document.getElementById('pwa-update');
  if (toast) toast.classList.add('visible');
  window._updateReg = reg;
}

window._applyUpdate = function () {
  const reg = window._updateReg;
  if (reg && reg.waiting) {
    reg.waiting.postMessage({ type: 'SKIP_WAITING' });
  }
};
</script>
